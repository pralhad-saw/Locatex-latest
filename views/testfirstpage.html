<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>From Lost to Found</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: white;
    }

    /* Purple Top Section */
    .header {
        background: linear-gradient(135deg, #6e0080, #8a00b3);
        height: 45vh;
        position: relative;
        overflow: hidden;
    }

    /* Logout button */
    .logout {
        position: absolute;
        top: 20px;
        right: 30px;
        background: white;
        color: #6e0080;
        padding: 6px 16px;
        font-size: 12px;
        font-weight: bold;
        border-radius: 5px;
        border: 1px solid #eee;
        cursor: pointer;
    }

    /* Curved white area */
    .curve {
        position: absolute;
        bottom: -50px;
        left: 50%;
        transform: translateX(-50%);
        width: 140%;
        height: 200px;
        background: white;
        border-radius: 50%;
    }

    /* Text inside curved area */
    .content {
        text-align: center;
        margin-top: -40px;
        color: #7a0099;
        font-weight: bold;
    }

    .content h1 {
        font-size: 32px;
        margin-top: 10px;
        color: white;
    }

    .content h2 {
        font-size: 20px;
        margin-top: 10px;
    }
</style>

</head>
<body>

<div class="header">
    <button class="logout">LOGOUT</button>
    <div class="curve"></div>
</div>

<div class="content">
    
    <h1>FASTER THAN EVER</h1>
</div>

</body>
</html>
